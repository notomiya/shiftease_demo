<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShiftEase Full Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8f6}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8f6}
</style>
</head>
<body>
<iframe id="app" src="/full-demo-base" title="ShiftEase Full Demo"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const css=`@media(max-width:700px){
    #emp .hero{margin-bottom:30px!important;box-shadow:0 10px 24px rgba(22,132,91,.14)}
    #emp .page.active>.grid:first-child{margin-top:4px}
    #emp>.nav{padding:10px 10px calc(10px + env(safe-area-inset-bottom))!important;gap:8px!important;background:rgba(255,255,255,.97)!important;border-top:1px solid #d9e5df!important;box-shadow:0 -8px 24px rgba(23,60,44,.12)!important;backdrop-filter:blur(12px)}
    #emp>.nav button{min-height:72px!important;border-radius:16px!important;border:1px solid #dfe9e4!important;background:#fff!important;color:#177b58!important;padding:8px 3px!important;font-size:12px!important;line-height:1.15!important;box-shadow:0 3px 10px rgba(23,60,44,.08)!important;transition:.15s ease}
    #emp>.nav button.active{background:#16845b!important;color:#fff!important;border-color:#16845b!important;transform:translateY(-2px);box-shadow:0 7px 16px rgba(22,132,91,.25)!important}
    #emp>.nav .navIconImg,#admin .adminnav .adminIconImg{display:block;width:28px;height:28px;object-fit:contain;margin:0 auto 5px;filter:brightness(0) saturate(100%) invert(35%) sepia(17%) saturate(1648%) hue-rotate(102deg) brightness(97%) contrast(87%)}
    #emp>.nav button.active .navIconImg{filter:brightness(0) invert(1)}
    #emp>.nav .navLabel{display:block;font-size:12px;font-weight:900;letter-spacing:.01em}
    #eh>.grid .quick{min-height:126px!important;padding:17px!important;box-shadow:0 5px 15px rgba(23,60,44,.07);border-color:#dfe8e3!important}
    #eh>.grid .quick .quickIconImg{display:block;width:31px;height:31px;object-fit:contain;margin-bottom:8px;filter:brightness(0) saturate(100%) invert(35%) sepia(17%) saturate(1648%) hue-rotate(102deg) brightness(97%) contrast(87%)}
    #eh>.grid .quick:nth-child(2) .quickIconImg{filter:brightness(0) saturate(100%) invert(44%) sepia(83%) saturate(1257%) hue-rotate(182deg) brightness(83%) contrast(88%)}
    #eh>.grid .quick b{font-size:16px;color:#177b58}#eh>.grid .quick:nth-child(2) b{color:#2478c7}#eh>.grid .quick:nth-child(4) b{color:#b66a00}
    #admin .adminnav{gap:10px!important;margin:8px 0 26px!important}
    #admin .adminnav button{min-height:96px!important;border:1px solid #dfe8e3!important;background:#fff!important;border-radius:18px!important;padding:13px 10px!important;color:#17211c!important;font-size:14px!important;font-weight:900!important;box-shadow:0 5px 15px rgba(23,60,44,.08)!important}
    #admin .adminnav button:nth-child(1){background:#16845b!important;color:#fff!important;border-color:#16845b!important}#admin .adminnav button:nth-child(2){background:#2478c7!important;color:#fff!important;border-color:#2478c7!important}#admin .adminnav button:nth-child(5){grid-column:1/-1;min-height:78px!important}
    #admin .adminnav button:nth-child(1) .adminIconImg,#admin .adminnav button:nth-child(2) .adminIconImg{filter:brightness(0) invert(1)}
    #admin .adminnav button:nth-child(5) .adminIconImg{filter:brightness(0) saturate(100%) invert(35%) sepia(17%) saturate(1648%) hue-rotate(102deg) brightness(97%) contrast(87%)}
    #admin .adminnav .adminLabel{display:block;font-weight:900}
  }`;
  const style=d.createElement('style');style.textContent=css;d.head.appendChild(style);
  const icon=(path,cls,label)=>`<img class="${cls}Img" src="${path}" alt=""><span class="${cls==='navIcon'?'navLabel':'adminLabel'}">${label}</span>`;
  const empNav=d.querySelector('#emp>.nav');if(empNav){const paths=['/assets/icons/home.svg','/assets/icons/calendar.svg','/assets/icons/calendar.svg',null];const labels=['ホーム','希望提出','シフト','交代'];[...empNav.querySelectorAll('button')].forEach((b,i)=>{b.innerHTML=paths[i]?icon(paths[i],'navIcon',labels[i]):`<span style="font-size:27px;line-height:30px;display:block;margin-bottom:4px">↻</span><span class="navLabel">交代</span>`;if(i===0)b.classList.add('active');b.addEventListener('click',()=>{empNav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')})})}
  const quicks=d.querySelectorAll('#eh>.grid .quick');const qpaths=['/assets/icons/calendar.svg','/assets/icons/calendar.svg',null,null];quicks.forEach((b,i)=>{const bold=b.querySelector('b');if(bold&&!b.querySelector('.quickIconImg')&&!b.querySelector('.quickIcon')){if(qpaths[i]){const img=d.createElement('img');img.className='quickIconImg';img.src=qpaths[i];img.alt='';[...b.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.remove());b.insertBefore(img,b.firstChild)}else{const s=d.createElement('span');s.style.fontSize='31px';s.style.display='block';s.style.marginBottom='8px';s.textContent=i===2?'↻':'☎️';[...b.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.remove());b.insertBefore(s,b.firstChild)}}});
  const adminNav=d.querySelector('#admin .adminnav');if(adminNav){const paths=['/assets/icons/home.svg','/assets/icons/calendar.svg',null,null,'/assets/icons/megaphone.svg'];const labels=['ホーム','シフト作成','希望提出状況','従業員管理','お知らせ'];[...adminNav.querySelectorAll('button')].forEach((b,i)=>{if(paths[i])b.innerHTML=icon(paths[i],'adminIcon',labels[i]);else b.innerHTML=`<span style="font-size:29px;line-height:32px;display:block;margin-bottom:6px">${i===2?'✓':'👥'}</span><span class="adminLabel">${labels[i]}</span>`})}
});
</script>
</body>
</html>
