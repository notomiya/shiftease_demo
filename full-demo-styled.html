<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ShiftEase Full Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8f6}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5f8f6}
</style>
</head>
<body>
<iframe id="app" src="/full-demo-base" title="ShiftEase Full Demo"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;if(!d)return;
  const css=`@media(max-width:700px){
    #emp .hero{margin-bottom:30px!important;box-shadow:0 10px 24px rgba(22,132,91,.14)}
    #emp .page.active>.grid:first-child{margin-top:4px}
    #emp>.nav{padding:10px 10px calc(10px + env(safe-area-inset-bottom))!important;gap:8px!important;background:rgba(255,255,255,.97)!important;border-top:1px solid #d9e5df!important;box-shadow:0 -8px 24px rgba(23,60,44,.12)!important;backdrop-filter:blur(12px)}
    #emp>.nav button{min-height:72px!important;border-radius:16px!important;border:1px solid #dfe9e4!important;background:#fff!important;color:#177b58!important;padding:8px 3px!important;font-size:12px!important;line-height:1.15!important;box-shadow:0 3px 10px rgba(23,60,44,.08)!important;transition:.15s ease}
    #emp>.nav button.active{background:#16845b!important;color:#fff!important;border-color:#16845b!important;transform:translateY(-2px);box-shadow:0 7px 16px rgba(22,132,91,.25)!important}
    .svgIcon{display:block;width:34px;height:34px;margin:0 auto 5px;color:inherit}.quickSvg{width:36px;height:36px;margin:0 0 8px;color:#177b58}.quick:nth-child(2) .quickSvg{color:#2478c7}
    .svgIcon svg,.quickSvg svg{display:block;width:100%;height:100%}
    #emp>.nav .navLabel{display:block;font-size:12px;font-weight:900;letter-spacing:.01em}
    #eh>.grid .quick{min-height:126px!important;padding:17px!important;box-shadow:0 5px 15px rgba(23,60,44,.07);border-color:#dfe8e3!important}
    #eh>.grid .quick b{font-size:16px;color:#177b58}#eh>.grid .quick:nth-child(2) b{color:#2478c7}#eh>.grid .quick:nth-child(4) b{color:#b66a00}
    #admin .adminnav{gap:10px!important;margin:8px 0 26px!important}
    #admin .adminnav button{min-height:96px!important;border:1px solid #dfe8e3!important;background:#fff!important;border-radius:18px!important;padding:13px 10px!important;color:#17211c!important;font-size:14px!important;font-weight:900!important;box-shadow:0 5px 15px rgba(23,60,44,.08)!important}
    #admin .adminnav button:nth-child(1){background:#16845b!important;color:#fff!important;border-color:#16845b!important}#admin .adminnav button:nth-child(2){background:#2478c7!important;color:#fff!important;border-color:#2478c7!important}#admin .adminnav button:nth-child(5){grid-column:1/-1;min-height:78px!important;color:#177b58!important}
    #admin .adminnav .adminLabel{display:block;font-weight:900}
  }`;
  const style=d.createElement('style');style.textContent=css;d.head.appendChild(style);

  const svgs={
    home:`<svg viewBox="0 0 512 512" aria-hidden="true"><polygon fill="currentColor" points="256.031,7.375 0,190.313 0,504.625 201.609,504.625 201.609,336.672 310.391,336.672 310.391,504.625 512,504.625 512,190.313"/></svg>`,
    calendar:`<svg viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M149.192,103.525c15.995,0,28.964-12.97,28.964-28.973V28.964C178.157,12.97,165.187,0,149.192,0C133.19,0,120.22,12.97,120.22,28.964v45.588C120.22,90.556,133.19,103.525,149.192,103.525z"/><path fill="currentColor" d="M362.815,103.525c15.994,0,28.964-12.97,28.964-28.973V28.964C391.78,12.97,378.809,0,362.815,0c-16.003,0-28.973,12.97-28.973,28.964v45.588C333.843,90.556,346.812,103.525,362.815,103.525z"/><path fill="currentColor" d="M435.164,41.287h-17.925v33.265c0,30.018-24.415,54.432-54.423,54.432c-30.017,0-54.432-24.414-54.432-54.432V41.287H203.615v33.265c0,30.018-24.414,54.432-54.423,54.432c-30.017,0-54.431-24.414-54.431-54.432V41.287H76.836c-38.528,0-69.763,31.235-69.763,69.763v331.187C7.073,480.765,38.308,512,76.836,512h358.328c38.528,0,69.763-31.235,69.763-69.763V111.05C504.927,72.522,473.691,41.287,435.164,41.287z M450.023,429.988c0,17.826-14.502,32.329-32.328,32.329H94.305c-17.825,0-32.328-14.503-32.328-32.329V170.876h388.046V429.988z"/></svg>`,
    megaphone:`<svg viewBox="0 0 512 512" aria-hidden="true"><path fill="currentColor" d="M501.419,355.229l-37.875,4c-5.516,0.594-12.766-2.531-16.125-6.938l-143.157-187.75c-3.359-4.406-8.359-4.094-11.109,0.719L167.747,384.354c-2.75,4.797-0.5,9.281,5,9.938l234.406,28.359c5.5,0.656,11.859,5.328,14.141,10.375l15.719,34.703c4.453,9.094,15,7.156,16.875-1.203c0,0,6.203-25.828,19.344-48.781c13.125-22.938,35.703-47.375,35.703-47.375C515.169,364.525,511.528,354.447,501.419,355.229z"/><polygon fill="currentColor" points="257.668,166.697 178.153,38.275 160.497,49.213 240.028,177.619"/><polygon fill="currentColor" points="-0.003,349.494 151.012,353.041 151.497,332.307 0.497,328.744"/></svg>`
  };
  const iconHtml=(name,label,cls='svgIcon',labelCls='navLabel')=>`<span class="${cls}">${svgs[name]}</span><span class="${labelCls}">${label}</span>`;

  const empNav=d.querySelector('#emp>.nav');
  if(empNav){
    const defs=[['home','ホーム'],['calendar','希望提出'],['calendar','シフト'],[null,'交代']];
    [...empNav.querySelectorAll('button')].forEach((b,i)=>{
      b.innerHTML=defs[i][0]?iconHtml(defs[i][0],defs[i][1]):`<span style="font-size:31px;line-height:34px;display:block;margin-bottom:4px;color:inherit">↻</span><span class="navLabel">交代</span>`;
      if(i===0)b.classList.add('active');
      b.addEventListener('click',()=>{empNav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
    });
  }

  const quicks=d.querySelectorAll('#eh>.grid .quick');
  quicks.forEach((b,i)=>{
    if((i===0||i===1)&&!b.querySelector('.quickSvg')){
      const s=d.createElement('span');s.className='quickSvg';s.innerHTML=svgs.calendar;
      [...b.childNodes].filter(n=>n.nodeType===3).forEach(n=>n.remove());b.insertBefore(s,b.firstChild);
    }
  });

  const adminNav=d.querySelector('#admin .adminnav');
  if(adminNav){
    const defs=[['home','ホーム'],['calendar','シフト作成'],[null,'希望提出状況'],[null,'従業員管理'],['megaphone','お知らせ']];
    [...adminNav.querySelectorAll('button')].forEach((b,i)=>{
      if(defs[i][0]) b.innerHTML=iconHtml(defs[i][0],defs[i][1],'svgIcon','adminLabel');
      else b.innerHTML=`<span style="font-size:29px;line-height:34px;display:block;margin-bottom:6px">${i===2?'✓':'👥'}</span><span class="adminLabel">${defs[i][1]}</span>`;
    });
  }
});
</script>
</body>
</html>
