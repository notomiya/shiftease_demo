<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ShiftEase 実運用デモ</title><link rel="stylesheet" href="/demo-realistic.css"><link rel="stylesheet" href="/demo-extensions.css"></head><body><div id="toast" class="toast"></div><section id="login" class="loginBox wrap"><div class="logo">S</div><h1>ShiftEase</h1><p class="muted">希望回収からシフト作成・共有まで。考える手間を減らすシフト管理。</p><div class="card"><div class="demoBanner">公開用デモです。氏名・番号・勤務情報はすべて架空です。</div><h2>ログイン</h2><label>従業員番号</label><input id="empNo" value="0000" inputmode="numeric"><button class="btn full" style="margin-top:8px" onclick="loginEmployee()">従業員としてログイン</button><p class="muted" style="text-align:center">または</p><button class="btn alt full" onclick="toggleAdminLogin()">管理者デモを見る</button><div id="adminLogin" class="hidden"><label>管理者PIN</label><input id="adminPin" value="1234" type="password"><button class="btn blue full" style="margin-top:8px" onclick="loginAdmin()">管理者としてログイン</button></div></div></section><section id="employeeApp" class="hidden"><div class="wrap"><div class="top"><div><b>ShiftEase</b><h2 style="margin-bottom:3px">こんばんは、<span id="empName">仲村日向</span>さん</h2><span class="muted small">デモ店舗</span></div><div><span id="requestStatus" class="pill">次回希望：提出済み</span> <span id="notifPill" class="pill warn">通知 3件</span></div></div><div id="emp-home" class="page active"></div><div id="emp-request" class="page"></div><div id="emp-shifts" class="page"></div><div id="emp-swap" class="page"></div><div class="logout"><button onclick="logout()">ログアウト</button></div></div><nav class="nav" id="empNav"></nav></section><section id="adminApp" class="hidden"><div class="adminWrap"><div class="top"><div><b>ShiftEase 管理者</b><h2 style="margin-bottom:3px">デモ店舗</h2><span class="muted small">20名在籍</span></div><button class="btn ghost sm" onclick="logout()">ログアウト</button></div><div class="adminnav" id="adminNav"></div><div id="admin-home" class="page active"></div><div id="admin-create" class="page"></div><div id="admin-status" class="page"></div><div id="admin-staff" class="page"></div><div id="admin-notices" class="page"></div></div></section><script src="/demo-realistic.js"></script><script src="/demo-extensions.js"></script></body></html>
